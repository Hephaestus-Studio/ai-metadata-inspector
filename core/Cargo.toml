[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- WASM & JS Interop ---
wasm-bindgen = "0.2.128"
serde-wasm-bindgen = "0.6.5"

# --- Serialization & JSON ---
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"

# --- Image Metadata Parsing ---
kamadak-exif = "0.6.1"

# --- Compression & Checksum (PNG Chunks/zTXt/iTXt) ---
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5.2"

[dev-dependencies]
# --- Testing for WASM ---
wasm-bindgen-test = "0.3.78"
